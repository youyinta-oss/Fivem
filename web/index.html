<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赠礼系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="container">
            <header>
                <h1>🎁 赠礼系统</h1>
                <button id="closeBtn" class="btn btn-close">✕</button>
            </header>
            
            <nav class="tabs">
                <button class="tab active" data-tab="gifts">发送礼物</button>
                <button class="tab" data-tab="redpackets">红包大厅</button>
                <button class="tab" data-tab="createRedPacket">发红包</button>
                <button class="tab" data-tab="history">历史记录</button>
            </nav>
            
            <div class="tab-content">
                <div id="gifts" class="tab-panel active">
                    <div class="form-group">
                        <label>赠送对象</label>
                        <select id="targetType">
                            <option value="player">指定玩家</option>
                            <option value="all">全部在线玩家</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="playerSelectGroup">
                        <label>选择玩家</label>
                        <select id="playerSelect">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>礼物类型</label>
                        <select id="giftType">
                            <option value="item">物品</option>
                            <option value="money">货币</option>
                            <option value="weapon">武器</option>
                            <option value="vehicle">车辆</option>
                        </select>
                    </div>
                    
                    <div id="itemSettings" class="gift-settings">
                        <div class="form-group">
                            <label>物品名称</label>
                            <input type="text" id="itemName" placeholder="例如: bread">
                        </div>
                        <div class="form-group">
                            <label>数量</label>
                            <input type="number" id="itemAmount" value="1" min="1">
                        </div>
                    </div>
                    
                    <div id="moneySettings" class="gift-settings hidden">
                        <div class="form-group">
                            <label>货币类型</label>
                            <select id="moneyType">
                                <option value="money">现金</option>
                                <option value="bank">银行</option>
                                <option value="black_money">黑钱</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>金额</label>
                            <input type="number" id="moneyAmount" value="1000" min="1">
                        </div>
                    </div>
                    
                    <div id="weaponSettings" class="gift-settings hidden">
                        <div class="form-group">
                            <label>武器</label>
                            <select id="weaponSelect"></select>
                        </div>
                        <div class="form-group">
                            <label>弹药数量</label>
                            <input type="number" id="weaponAmmo" value="1000" min="1">
                        </div>
                    </div>
                    
                    <div id="vehicleSettings" class="gift-settings hidden">
                        <div class="form-group">
                            <label>车辆</label>
                            <select id="vehicleSelect"></select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>留言 (可选)</label>
                        <textarea id="giftMessage" placeholder="写点什么..."></textarea>
                    </div>
                    
                    <button id="sendGiftBtn" class="btn btn-primary">发送礼物</button>
                </div>
                
                <div id="redpackets" class="tab-panel">
                    <h3>可抢的红包</h3>
                    <div id="redpacketList" class="list">
                        <p class="empty">暂无红包</p>
                    </div>
                </div>
                
                <div id="createRedPacket" class="tab-panel">
                    <div class="form-group">
                        <label>红包类型</label>
                        <select id="packetType">
                            <option value="item">物品红包</option>
                            <option value="money">货币红包</option>
                            <option value="weapon">武器红包</option>
                            <option value="vehicle">车辆红包</option>
                        </select>
                    </div>
                    
                    <div id="packetItemSettings" class="packet-settings">
                        <div class="form-group">
                            <label>物品名称</label>
                            <input type="text" id="packetItemName" placeholder="例如: bread">
                        </div>
                        <div class="form-group">
                            <label>总数量</label>
                            <input type="number" id="packetTotalAmount" value="10" min="1">
                        </div>
                    </div>
                    
                    <div id="packetMoneySettings" class="packet-settings hidden">
                        <div class="form-group">
                            <label>货币类型</label>
                            <select id="packetMoneyType">
                                <option value="money">现金</option>
                                <option value="bank">银行</option>
                                <option value="black_money">黑钱</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>总金额</label>
                            <input type="number" id="packetTotalMoney" value="10000" min="1">
                        </div>
                    </div>
                    
                    <div id="packetWeaponSettings" class="packet-settings hidden">
                        <div class="form-group">
                            <label>武器</label>
                            <select id="packetWeaponSelect"></select>
                        </div>
                        <div class="form-group">
                            <label>弹药数量</label>
                            <input type="number" id="packetWeaponAmmo" value="1000" min="1">
                        </div>
                    </div>
                    
                    <div id="packetVehicleSettings" class="packet-settings hidden">
                        <div class="form-group">
                            <label>车辆</label>
                            <select id="packetVehicleSelect"></select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>红包个数</label>
                        <input type="number" id="packetCount" value="5" min="1">
                    </div>
                    
                    <div class="form-group">
                        <label>分配模式</label>
                        <select id="packetMode">
                            <option value="random">随机分配</option>
                            <option value="equal">平均分配</option>
                            <option value="first_come">先到先得</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>过期时间 (秒，可选)</label>
                        <input type="number" id="packetTimeout" value="300" min="0" placeholder="0表示永不过期">
                    </div>
                    
                    <button id="createRedPacketBtn" class="btn btn-primary">发红包</button>
                </div>
                
                <div id="history" class="tab-panel">
                    <h3>收到的礼物</h3>
                    <div id="historyList" class="list">
                        <p class="empty">暂无记录</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification hidden"></div>
    
    <script src="js/user.js"></script>
</body>
</html>
